</style></head><body><div class="shell" id="app"><header><div><div class="brand">Lehrer-Cockpit</div><small>Mein Unterrichtswerkzeug</small></div><div class="row"><select id="profile" class="profile" aria-label="Unterrichtsprofil"></select><button class="tiny" id="configure">⚙ Einstellungen</button></div></header><div class="bar"><span class="sectionLabel">SCHNELLZUGRIFFE</span><button class="tiny ghost" id="editQuick">✎ Bearbeiten</button></div><div class="quick" id="quick"></div><div class="bar"><span class="sectionLabel">ARBEITSBEREICH</span><div class="row"><button class="tiny ghost" data-layout="equal">50:50</button><button class="tiny ghost" data-layout="wide">65:35</button><button class="tiny ghost" data-layout="focus">Fokus</button></div></div><main class="work" id="work"></main><div class="status" id="status"><span>Keine laufenden Vorgänge</span></div><nav class="nav"><button data-open="timer">◷ Timer</button><button data-open="sounds">♫ Sounds</button><button data-open="groups">♧ Gruppen</button><button data-open="task">▤ Auftrag</button><button data-open="dice">⚄ Würfel</button><button data-open="scores">★ Punkte</button><button id="moreTools">＋ Weitere</button></nav></div><div id="modalRoot"></div><script>
'use strict';
const TOOLS={timer:['Timer','◷'],sounds:['Sounds','♫'],dice:['Würfel','⚄'],students:['Schüler','♧'],groups:['Gruppen','♧'],task:['Auftrag','▤'],scores:['Punkte','★'],qr:['QR-Code','▦'],traffic:['Ampel','●'],wheel:['Glücksrad','◉']};
const KEY='lehrer-cockpit-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};
const defaults={profiles:[{name:'Allgemein',students:[]},{name:'Demo-Klasse (30)',students:['Anna','Ben','Clara','David','Emma','Felix','Greta','Hannes','Ida','Jonas','Klara','Lena','Milan','Nele','Oskar','Paula','Robin','Sophie','Tim','Valentina','Yusuf','Mara','Noah','Lina','Leo','Mia','Paul','Sara','Theo','Zoe']}],currentProfile:1,shortcuts:['timer','sounds','dice','students','groups','task','scores','qr'],task:'Vergleicht die beiden Klimadiagramme. Notiert drei wichtige Unterschiede.',social:'Partnerarbeit',groupSize:4,groupCount:4,groupMethod:'size',soundVolume:.5};
let store={...defaults,...saved};function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){alert('Speichern fehlgeschlagen: '+e.message)}};
let panes=['timer','task'],selectedPane=1,layout='equal',active={},timer={end:0,left:600,running:false,preset:600,alarm:true},scoreTeams=[{name:'Team A',value:0},{name:'Team B',value:0}],scoreHistory=[],groupResult=[],absent=new Set(),picked=null,lastRoll=[4],wheelChoices=['A','B','C','D','E','F'],wheelResult='',target='';
const $=(sel,scope=document)=>scope.querySelector(sel);const $$=(sel,scope=document)=>Array.from(scope.querySelectorAll(sel));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const prof=()=>store.profiles[store.currentProfile]||store.profiles[0];const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function renderProfiles(){let e=$('#profile');e.innerHTML=store.profiles.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('');e.value=store.currentProfile}
function showTool(id){if(!TOOLS[id])return;if(panes.includes(id)){selectedPane=panes.indexOf(id)}else if(panes.length<2){panes.push(id);selectedPane=panes.length-1}else{panes[selectedPane]=id}layout=layout==='focus'?'equal':layout;render()}
function renderQuick(){ $('#quick').innerHTML=store.shortcuts.map((id,i)=>`<button class="shortcut ${panes.includes(id)?'active':''}" data-quick="${i}"><span class="symbol">${TOOLS[id]?.[1]||'◻'}</span><span>${TOOLS[id]?.[0]||id}</span></button>`).join('')}
function render(){renderQuick();let ids=layout==='focus'?[panes[selectedPane]]:panes;let flexes=layout==='wide'?[1.86,1]:[1,1];$('#work').innerHTML=ids.filter(Boolean).map((id,i)=>{let real=panes.indexOf(id);return `<section class="pane ${real===selectedPane?'selected':''}" data-pane="${real}" style="flex:${layout==='focus'?1:flexes[real]||1}"><div class="paneHead"><strong>${TOOLS[id][1]} ${TOOLS[id][0]}</strong><div class="controls"><button data-act="select" data-i="${real}" title="Arbeitsfeld auswählen">${real===selectedPane?'●':'○'}</button><button data-act="expand" data-i="${real}" title="Fokusansicht">⛶</button><button data-act="close" data-i="${real}" title="Ausblenden">×</button></div></div><div class="paneBody">${toolMarkup(id)}</div></section>`}).join('')||'<div class="empty">Oben ein Werkzeug öffnen</div>';updateStatus()}
function toolMarkup(id){if(id==='timer'){let t=timer.left;return `<div class="stack"><div class="choices">${[1,3,5,10,15,45].map(m=>`<button class="tiny ${timer.preset===m*60?'active':''}" data-min="${m}">${m}m</button>`).join('')}</div><div class="bigtime" data-time>${formatTime(t)}</div><div class="row"><button class="primary" data-timer="toggle">${timer.running?'❚❚ Pause':'▶ Start'}</button><button data-timer="reset">↻ Reset</button><button data-timer="add">+1 min</button></div><label class="row"><input type="checkbox" id="alarm" ${timer.alarm?'checked':''}> Gong am Ende</label></div>`}
if(id==='sounds'){return `<div class="stack"><div class="soundGrid">${[['Applaus','👏','applause'],['Möööp','📣','boop'],['Tusch','🎉','fanfare'],['Gong','🔔','gong'],['Trommel','🥁','drum'],['Jubel','★','cheer'],['Fehler','✖','error'],['Lachen','☺','laugh']].map(s=>`<button data-sound="${s[2]}"><span>${s[1]}</span>${s[0]}</button>`).join('')}</div><div class="row"><label for="volume">Lautstärke</label><input id="volume" type="range" min="0" max="100" value="${Math.round(store.soundVolume*100)}"><button data-stop-sound>■ Stopp</button></div><small>Sounds werden synthetisch im Browser erzeugt.</small></div>`}
if(id==='dice'){return `<div class="stack"><div class="row"><label>Seiten <select class="field" id="diceSides">${[6,10,20].map(n=>`<option ${n===diceSides?'selected':''}>${n}</option>`).join('')}</select></label><label>Anzahl <select class="field" id="diceCount">${[1,2,3].map(n=>`<option ${n===diceCount?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="bigtime">${lastRoll.join(' · ')}</div>${lastRoll.length>1?`<p class="center">Summe ${lastRoll.reduce((a,b)=>a+b,0)}</p>`:''}<button class="primary" data-roll>⚄ Würfeln</button></div>`}
if(id==='groups'||id==='students'){let names=prof().students, present=names.filter(n=>!absent.has(n));return `<div class="stack"><div class="row"><strong>${esc(prof().name)}</strong><span class="pill">${present.length} anwesend</span></div><div class="row"><button class="tiny" data-manage>Klassenliste bearbeiten</button><button class="tiny" data-absent>Anwesenheit (${absent.size} abwesend)</button></div>${id==='students'?`<div class="bigtime" style="font-size:30px">${esc(picked||'?')}</div><button class="primary" data-pick>Person auslosen</button>`:`<div class="row"><select class="field" style="width:auto" id="groupMethod"><option value="size" ${store.groupMethod==='size'?'selected':''}>Gruppengröße max.</option><option value="count" ${store.groupMethod==='count'?'selected':''}>Anzahl Gruppen</option></select><select class="field" style="width:auto" id="groupValue">${[2,3,4,5,6,7,8,9,10].map(n=>`<option value="${n}" ${n===(store.groupMethod==='size'?store.groupSize:store.groupCount)?'selected':''}>${n}</option>`).join('')}</select><button class="primary" data-makegroups>⇄ Gruppen bilden</button></div><div class="groupGrid">${groupResult.map((g,i)=>`<div class="group"><h3>Gruppe ${i+1}</h3>${g.map(n=>`<button class="${movingName===n?'marked':''}" data-move="${esc(n)}" data-from="${i}" title="Zum Verschieben antippen">${esc(n)}</button>`).join('')}<button data-dest="${i}" title="Hierhin verschieben">＋</button></div>`).join('')}</div>${groupResult.length?'<small>Zum Verschieben zuerst einen Namen, dann das ＋ der Zielgruppe antippen.</small>':''}`}</div>`}
if(id==='task'){return `<div class="stack"><label class="label">Arbeitsauftrag</label><textarea class="field fieldarea" id="taskText">${esc(store.task)}</textarea><div class="row"><select class="field" style="width:auto" id="social">${['Einzelarbeit','Partnerarbeit','Gruppenarbeit','Plenum'].map(v=>`<option ${v===store.social?'selected':''}>${v}</option>`).join('')}</select><button class="primary" data-present>▣ Präsentation</button><button data-tasktimer>Mit Timer</button></div><div class="preview" style="font-size:16px;background:#1a222c;padding:12px;border-radius:9px">${esc(store.task)}</div></div>`}
if(id==='scores'){return `<div class="stack"><div class="scoreGrid">${scoreTeams.map((t,i)=>`<div class="team"><div>${esc(t.name)}</div><div class="points">${t.value}</div><div class="row" style="justify-content:center"><button data-score="${i}" data-delta="-1">−</button><button class="primary" data-score="${i}" data-delta="1">＋</button></div></div>`).join('')}</div><div class="row"><button data-scoreundo ${scoreHistory.length?'':'disabled'}>↶ Rückgängig</button><button data-newteam ${scoreTeams.length>=6?'disabled':''}>＋ Team</button><button data-scorereset>Reset</button></div></div>`}
if(id==='traffic'){return `<div class="stack"><div class="lights">${[['red','#eb777a'],['yellow','#f0ca75'],['green','#68d293']].map(([k,c])=>`<button class="light ${light===k?'on':''}" style="background:${c}" data-light="${k}" aria-label="${k}"></button>`).join('')}</div><div class="center">${{red:'Stopp',yellow:'Endspurt',green:'Arbeitsphase'}[light]}</div></div>`}
if(id==='wheel'){return `<div class="stack"><label class="label">Einträge (eine Zeile pro Eintrag)</label><textarea class="field" id="wheelItems" rows="3">${esc(wheelChoices.join('\n'))}</textarea><div class="bigtime" style="font-size:32px">${esc(wheelResult||'◉')}</div><button class="primary" data-wheel>Auslosen</button></div>`}
if(id==='qr'){return `<div class="stack"><label class="label">Link oder Text</label><input class="field" id="qrValue" value="${esc(qrInput)}" placeholder="https://…"><button class="primary" data-qr>QR-Code erzeugen</button><div class="center">${qrInput?'<small>QR-Erzeugung folgt in einer Erweiterung. Bis dahin Link kopieren:</small>':''}</div><button data-copy>Link kopieren</button></div>`}return ''}
let diceSides=6,diceCount=1,light='green',movingName=null,qrInput='';function formatTime(s){s=Math.max(0,Math.ceil(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function updateStatus(){const s=$('#status');s.innerHTML=timer.running?`<span>◷ Timer läuft: <b data-status-time>${formatTime(timer.left)}</b></span><span><button class="tiny" data-open="timer">Öffnen</button><button class="tiny" data-timer="toggle">Pause</button></span>`:`<span>◷ ${timer.left!==timer.preset?`Timer pausiert: ${formatTime(timer.left)}`:'Keine laufenden Vorgänge'}</span><span>${timer.left!==timer.preset?'<button class="tiny" data-open="timer">Öffnen</button>':''}</span>`}
function tick(){if(timer.running){let old=timer.left;timer.left=Math.max(0,(timer.end-Date.now())/1000);if(old>0&&timer.left===0){timer.running=false;if(timer.alarm)play('gong');render()}}$$('[data-time]').forEach(e=>e.textContent=formatTime(timer.left));$$('[data-status-time]').forEach(e=>e.textContent=formatTime(timer.left))}setInterval(tick,200);
let audioCtx=null,oscNodes=[];function play(type){try{audioCtx ||=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let now=audioCtx.currentTime;function note(f,d,start=0,w='sine',amp=.16){let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=w;o.frequency.setValueAtTime(f,now+start);g.gain.setValueAtTime(.0001,now+start);g.gain.exponentialRampToValueAtTime(Math.max(.0002,amp*store.soundVolume),now+start+.012);g.gain.exponentialRampToValueAtTime(.0001,now+start+d);o.connect(g).connect(audioCtx.destination);o.start(now+start);o.stop(now+start+d+.03);oscNodes.push(o)}if(type==='gong'){note(523,.9);note(784,1.1,.07)}else if(type==='boop'){note(190,.4,0,'sawtooth');note(125,.28,.17,'square')}else if(type==='fanfare'||type==='cheer'){[392,523,659,784].forEach((n,i)=>note(n,.23,i*.15,'triangle'))}else if(type==='error'){note(180,.26,0,'square');note(135,.26,.27,'square')}else if(type==='drum'||type==='applause'||type==='laugh'){let count=type==='applause'?14:type==='laugh'?6:10;for(let i=0;i<count;i++)note(120+Math.random()*700,.07,i*.06,'triangle',.1)} }catch(e){console.warn('Audio nicht verfügbar',e)}}
function modal(title,html){$('#modalRoot').innerHTML=`<div class="modalback"><div class="modal"><div class="bar"><h2>${esc(title)}</h2><button data-closemodal>✕</button></div>${html}</div></div>`};function closeModal(){$('#modalRoot').innerHTML=''};
function manageProfiles(){modal('Klassen und Profile',`<p class="hint">Klassenlisten bleiben in diesem Browser. Verwende aus Datenschutzgründen möglichst keine Schülernamen auf gemeinsam genutzten Geräten.</p><label class="label">Profil</label><select class="field" id="manageProfile">${store.profiles.map((p,i)=>`<option value="${i}" ${store.currentProfile===i?'selected':''}>${esc(p.name)}</option>`).join('')}</select><p><label class="label">Name des Profils</label><input class="field" id="manageName" value="${esc(prof().name)}"></p><p><label class="label">Schülernamen (eine Zeile pro Person)</label><textarea class="field" id="manageStudents" rows="10">${esc(prof().students.join('\n'))}</textarea></p><div class="row"><button class="primary" data-saveprofile>Speichern</button><button data-addprofile>Neues Profil</button><button data-deleteprofile>Profil löschen</button></div>`)}
function absentModal(){modal('Abwesende markieren',`<p class="hint">Die Anwesenheit gilt nur für die aktuelle Sitzung.</p><div class="namegrid">${prof().students.map(n=>`<button class="${absent.has(n)?'absent':''}" data-toggleabsent="${esc(n)}">${esc(n)}</button>`).join('')}</div><p><button class="primary" data-closemodal>Fertig</button></p>`)}
function settings(){modal('Einstellungen & Datensicherung',`<div class="stack"><button data-manage>Klassen und Profile verwalten</button><button data-editshort>Die acht Schnellzugriffe ändern</button><div class="hint">Export enthält alle Profile einschließlich eventueller Schülernamen. Sicherungsdatei vertraulich behandeln.</div><button data-export>Datensicherung herunterladen (JSON)</button><label class="label">Datensicherung importieren</label><input type="file" id="importFile" accept=".json,application/json"><button data-import>Import durchführen</button></div>`)}
function shortcutEditor(){modal('Schnellzugriffe bearbeiten',`<p class="hint">Acht Plätze. Bereits belegte Werkzeuge tauschen beim Auswählen ihre Position.</p>${store.shortcuts.map((id,i)=>`<div class="row" style="margin-bottom:7px"><span style="min-width:65px">Platz ${i+1}</span><select class="field" style="flex:1" data-shortselect="${i}">${Object.entries(TOOLS).map(([key,v])=>`<option value="${key}" ${key===id?'selected':''}>${esc(v[0])}</option>`).join('')}</select></div>`).join('')}<button class="primary" data-closemodal>Fertig</button>`)}
function exportData(){const blob=new Blob([JSON.stringify({schema:1,settings:store},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='lehrer-cockpit-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function updateGroup(){const names=prof().students.filter(n=>!absent.has(n)),n=store.groupMethod==='size'?Math.ceil(names.length/store.groupSize):Math.min(store.groupCount,names.length),a=shuffle(names);groupResult=n?Array.from({length:n},()=>[]):[];a.forEach((name,i)=>groupResult[i%n].push(name));movingName=null;render()}
function handleClick(e){let b=e.target.closest('button,[data-pane]');if(!b)return;let d=b.dataset;if(d.closemodal!==undefined){closeModal();return}if(d.open){showTool(d.open);return}if(d.quick!==undefined){showTool(store.shortcuts[+d.quick]);return}if(d.layout){layout=d.layout;render();return}if(d.act){let i=+d.i;if(d.act==='select')selectedPane=i;if(d.act==='expand'){selectedPane=i;layout=layout==='focus'?'equal':'focus'}if(d.act==='close'){panes.splice(i,1);selectedPane=Math.min(selectedPane,panes.length-1);if(selectedPane<0)selectedPane=0;layout='equal'}render();return}if(d.min){timer.preset=+d.min*60;timer.left=timer.preset;timer.running=false;render();return}if(d.timer){if(d.timer==='toggle'){if(timer.running){timer.left=Math.max(0,(timer.end-Date.now())/1000);timer.running=false}else{timer.end=Date.now()+timer.left*1000;timer.running=true}}if(d.timer==='reset'){timer.running=false;timer.left=timer.preset}if(d.timer==='add'){timer.left+=60;if(timer.running)timer.end+=60000}render();return}if(d.sound){play(d.sound);return}if(d.stopSound!==undefined){oscNodes.forEach(o=>{try{o.stop()}catch{}});oscNodes=[];return}if(d.roll!==undefined){lastRoll=Array.from({length:diceCount},()=>1+Math.floor(Math.random()*diceSides));render();return}if(d.makegroups!==undefined){updateGroup();return}if(d.pick!==undefined){let a=prof().students.filter(n=>!absent.has(n));picked=a[Math.floor(Math.random()*a.length)]||'Keine Personen';render();return}if(d.move!==undefined){movingName=d.move;render();return}if(d.dest!==undefined&&movingName){groupResult.forEach(g=>{let i=g.indexOf(movingName);if(i>=0)g.splice(i,1)});groupResult[+d.dest].push(movingName);movingName=null;render();return}if(d.manage!==undefined){manageProfiles();return}if(d.absent!==undefined){absentModal();return}if(d.toggleabsent!==undefined){absent.has(d.toggleabsent)?absent.delete(d.toggleabsent):absent.add(d.toggleabsent);groupResult=[];absentModal();return}if(d.saveprofile!==undefined){let i=+$('#manageProfile').value;store.profiles[i]={name:$('#manageName').value.trim()||'Profil',students:$('#manageStudents').value.split('\n').map(x=>x.trim()).filter(Boolean)};store.currentProfile=i;persist();absent.clear();groupResult=[];renderProfiles();closeModal();render();return}if(d.addprofile!==undefined){store.profiles.push({name:'Neues Profil',students:[]});store.currentProfile=store.profiles.length-1;persist();renderProfiles();manageProfiles();return}if(d.deleteprofile!==undefined){if(store.profiles.length<2)return alert('Mindestens ein Profil muss bleiben.');if(!confirm('Dieses Profil und die zugehörige Schülerliste löschen?'))return;store.profiles.splice(store.currentProfile,1);store.currentProfile=0;persist();renderProfiles();closeModal();render();return}if(d.editshort!==undefined){shortcutEditor();return}if(d.export!==undefined){exportData();return}if(d.import!==undefined){let f=$('#importFile').files[0];if(!f)return alert('Bitte zuerst Datei auswählen.');f.text().then(s=>{let data=JSON.parse(s);if(data.schema!==1||!Array.isArray(data.settings?.profiles)||!Array.isArray(data.settings?.shortcuts))throw Error('Ungültiges Dateiformat');if(!confirm('Aktuelle Daten durch Sicherungsdatei ersetzen?'))return;store={...defaults,...data.settings};persist();renderProfiles();closeModal();render()}).catch(err=>alert('Import fehlgeschlagen: '+err.message));return}if(d.score!==undefined){scoreHistory.push(structuredClone(scoreTeams));scoreTeams[+d.score].value=Math.max(0,scoreTeams[+d.score].value+(+d.delta));render();return}if(d.scoreundo!==undefined){if(scoreHistory.length)scoreTeams=scoreHistory.pop();render();return}if(d.newteam!==undefined){if(scoreTeams.length<6)scoreTeams.push({name:'Team '+String.fromCharCode(65+scoreTeams.length),value:0});render();return}if(d.scorereset!==undefined){scoreHistory.push(structuredClone(scoreTeams));scoreTeams.forEach(t=>t.value=0);render();return}if(d.light){light=d.light;render();return}if(d.wheel!==undefined){wheelChoices=$('#wheelItems').value.split('\n').map(x=>x.trim()).filter(Boolean);wheelResult=wheelChoices[Math.floor(Math.random()*wheelChoices.length)]||'';render();return}if(d.present!==undefined){let win=window.open('','lehrer-praesentation','width=1100,height=700');if(!win)return alert('Pop-up wurde blockiert.');win.document.open();win.document.write(`<!doctype html><html lang="de"><meta charset="utf-8"><title>Arbeitsauftrag</title><body style="background:#171b23;color:white;font:32px system-ui;margin:5vw;text-align:center"><small style="color:#65d6ba">${esc(store.social)}</small><div style="font-size:clamp(28px,5vw,70px);margin-top:3rem;white-space:pre-wrap">${esc(store.task)}</div></body></html>`);win.document.close();return}if(d.tasktimer!==undefined){showTool('timer');return}if(d.copy!==undefined){navigator.clipboard?.writeText(qrInput).then(()=>alert('Link kopiert')).catch(()=>prompt('Link kopieren:',qrInput));return}if(d.qr!==undefined){qrInput=$('#qrValue').value;render();return}}
document.addEventListener('click',handleClick);document.addEventListener('change',e=>{if(e.target.id==='profile'){store.currentProfile=+e.target.value;persist();absent.clear();groupResult=[];picked=null;render()}if(e.target.id==='alarm')timer.alarm=e.target.checked;if(e.target.id==='volume'){store.soundVolume=+e.target.value/100;persist()}if(e.target.id==='diceSides'){diceSides=+e.target.value;lastRoll=[];render()}if(e.target.id==='diceCount'){diceCount=+e.target.value;lastRoll=[];render()}if(e.target.id==='groupMethod'){store.groupMethod=e.target.value;persist();render()}if(e.target.id==='groupValue'){if(store.groupMethod==='size')store.groupSize=+e.target.value;else store.groupCount=+e.target.value;persist()}if(e.target.id==='social'){store.social=e.target.value;persist()}if(e.target.dataset.shortselect!==undefined){let i=+e.target.dataset.shortselect,id=e.target.value,j=store.shortcuts.indexOf(id);if(j>=0)[store.shortcuts[i],store.shortcuts[j]]=[store.shortcuts[j],store.shortcuts[i]];else store.shortcuts[i]=id;persist();shortcutEditor();render()}if(e.target.id==='manageProfile'){store.currentProfile=+e.target.value;persist();manageProfiles();renderProfiles()}});document.addEventListener('input',e=>{if(e.target.id==='taskText'){store.task=e.target.value;persist();let pv=e.target.closest('.paneBody')?.querySelector('.preview');if(pv)pv.textContent=store.task}if(e.target.id==='volume'){store.soundVolume=+e.target.value/100;persist()}});
$('#editQuick').onclick=shortcutEditor;$('#configure').onclick=settings;$('#moreTools').onclick=()=>modal('Alle Werkzeuge',`<div class="groupGrid">${Object.entries(TOOLS).map(([id,t])=>`<button data-open="${id}">${t[1]} ${t[0]}</button>`).join('')}</div>`);renderProfiles();render();
