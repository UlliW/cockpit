QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {

	}

	}

		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}

		if (buffer.getLengthInBits() >= totalDataCount * 8) {

		}

QRCode.createBytes = function(buffer, rsBlocks) {

		maxEcCount = Math.max(maxEcCount, ecCount);

		}

	for (var y = 0; y < rsBlocks.length; y++) {

	}

let todoProfileOnly=false,wheelUsed=new Set(),wheelAnimating=false;let diceSides=6,diceCount=1,light='green',movingName=null,qrInput='';let wheelNoRepeat=false,wheelSpinning=false,wheelAngle=0,spontanTime=10,spontanGoal='Alle',spontanNoMaterial=false,spontanIndex=0;store.wheelLists ||= {}; const START_IDEAS=[{"id":"v04-1","title":"Atemzüge pro Tag","type":"Rätsel","kind":"Knobeln","minutes":5,"max":5,"grades":"5–9","content":"Wie viele Atemzüge macht ein Mensch bei 14 Atemzügen pro Minute in 24 Stunden?","answer":"14 × 60 × 24 = 20.160 Atemzüge; im Alltag schwankt die Atemfrequenz.","description":"Erst einzeln schätzen, dann begründen und die Lösung aufdecken.","noMaterial":true},{"id":"v04-2","title":"Herzschläge pro Tag","type":"Rätsel","kind":"Knobeln","minutes":5,"max":5,"grades":"5–9","content":"Wie oft schlägt ein Herz bei 70 Schlägen pro Minute an einem Tag?","answer":"70 × 60 × 24 = 100.800 Schläge.","description":"Erst einzeln schätzen, dann begründen und die Lösung aufdecken.","noMaterial":true},{"id":"v04-3","title":"Lichtsekunde","type":"Rätsel","kind":"Knobeln","minutes":5,"max":5,"grades":"7–13","content":"Wie viele Kilometer legt Licht in einer Sekunde ungefähr zurück?","answer":"Etwa 300.000 km im Vakuum.","description":"Erst einzeln schätzen, dann begründen und die Lösung aufdecken.","noMaterial":true},{"id":"v04-4","title":"Kilometer zum Mond","type":"Rätsel","kind":"Knobeln","minutes":5,"max":5,"grades":"5–13","content":"Wie weit ist der Mond im Durchschnitt von der Erde entfernt?","answer":"Etwa 384.400 km (mittlerer Abstand der Mittelpunkte).","description":"Erst einzeln schätzen, dann begründen und die Lösung aufdecken.","noMaterial":true},{"id":"v04-5","title":"Wasser im Körper","type":"Rätsel","kind":"Knobeln","minutes":5,"max":5,"grades":"5–9","content":"Eine Person wiegt 50 kg. Grob wie viele Kilogramm davon sind Wasser, wenn man mit 60 % rechnet?","answer":"Etwa 30 kg. Der tatsächliche Anteil variiert mit Alter und Körperzusammensetzung.","description":"Erst einzeln schätzen, dann begründen und die Lösung aufdecken.","noMaterial":true},{"id":"v04-6","title":"Luft im Klassenzimmer","type":"Rätsel","kind":"Knobeln","minutes":5,"max":5,"grades":"6–13","content":"Der Raum misst 8 × 7 × 3 m. Wie viele Kubikmeter Luft sind das?","answer":"168 m³; bei etwa 1,2 kg Luft pro m³ wären es rund 200 kg Luft.","description":"Erst einzeln schätzen, dann begründen und die Lösung aufdecken.","noMaterial":true},{"id":"v04-7","title":"Papierfalten","type":"Rätsel","kind":"Knobeln","minutes":5,"max":5,"grades":"5–9","content":"Wie viele Schichten entstehen nach 8 Halbierungen/Faltungen theoretisch?","answer":"2 hoch 8 = 256 Schichten; echte Papierfaltungen sind praktisch begrenzt.","description":"Erst einzeln schätzen, dann begründen und die Lösung aufdecken.","noMaterial":true},{"id":"v04-8","title":"Regen pro Quadratmeter","type":"Rätsel","kind":"Knobeln","minutes":5,"max":5,"grades":"6–10","content":"Was bedeutet 1 mm Niederschlag auf einem Quadratmeter?","answer":"Genau 1 Liter Wasser pro m².","description":"Erst einzeln schätzen, dann begründen und die Lösung aufdecken.","noMaterial":true},{"id":"v04-9","title":"Erdumfang","type":"Rätsel","kind":"Knobeln","minutes":5,"max":5,"grades":"6–13","content":"Wie groß ist der Erdumfang am Äquator ungefähr?","answer":"Rund 40.075 km.","description":"Erst einzeln schätzen, dann begründen und die Lösung aufdecken.","noMaterial":true},{"id":"v04-10","title":"Blitz und Donner","type":"Rätsel","kind":"Knobeln","minutes":5,"max":5,"grades":"5–10","content":"Zwischen Blitz und Donner liegen 6 Sekunden. Wie weit ist das Gewitter ungefähr entfernt?","answer":"Rund 2 km, wenn man mit 3 Sekunden pro Kilometer rechnet.","description":"Erst einzeln schätzen, dann begründen und die Lösung aufdecken.","noMaterial":true},{"id":"v04-11","title":"Sekunden pro Tag","type":"Rätsel","kind":"Knobeln","minutes":5,"max":5,"grades":"5–9","content":"Wie viele Sekunden hat ein Tag?","answer":"24 × 60 × 60 = 86.400 Sekunden.","description":"Erst einzeln schätzen, dann begründen und die Lösung aufdecken.","noMaterial":true},{"id":"v04-12","title":"Plastikflasche","type":"Rätsel","kind":"Knobeln","minutes":5,"max":5,"grades":"5–7","content":"Wie viele 0,5-Liter-Flaschen braucht man für 10 Liter Wasser?","answer":"20 Flaschen.","description":"Erst einzeln schätzen, dann begründen und die Lösung aufdecken.","noMaterial":true},{"id":"v04-13","title":"Drei Schalter","type":"Rätsel","kind":"Knobeln","minutes":10,"max":10,"grades":"7–13","content":"Drei Schalter draußen steuern drei klassische Glühlampen drinnen. Du darfst nur einmal in den Raum. Wie findest du die Zuordnung?","answer":"Schalter A einige Minuten einschalten, wieder aus; B anlassen. Drinnen: leuchtend=B, warm=A, kalt=C. Mit LEDs klappt der Wärmetrick nicht zuverlässig.","description":"2 Minuten allein nachdenken, dann in Zweierteams vergleichen.","noMaterial":true},{"id":"v04-14","title":"Wolf, Ziege und Kohl","type":"Rätsel","kind":"Knobeln","minutes":10,"max":10,"grades":"5–9","content":"Boot trägt Person plus genau eines der drei Dinge. Wolf frisst Ziege, Ziege frisst Kohl. Wie kommen alle hinüber?","answer":"Ziege hin; allein zurück; Wolf hin; Ziege zurück; Kohl hin; allein zurück; Ziege hin.","description":"2 Minuten allein nachdenken, dann in Zweierteams vergleichen.","noMaterial":true},{"id":"v04-15","title":"Die fehlende Zahl","type":"Rätsel","kind":"Knobeln","minutes":10,"max":10,"grades":"6–10","content":"Welche Zahl setzt die Folge 2, 6, 12, 20, 30, … fort? Begründe.","answer":"42. Differenzen +4, +6, +8, +10, +12; alternativ n × (n+1).","description":"2 Minuten allein nachdenken, dann in Zweierteams vergleichen.","noMaterial":true},{"id":"v04-16","title":"Neun Punkte","type":"Rätsel","kind":"Knobeln","minutes":10,"max":10,"grades":"6–13","content":"Verbinde neun Punkte in einem 3×3-Raster mit vier geraden zusammenhängenden Strichen, ohne abzusetzen.","answer":"Man muss Linien über das gedachte Quadrat hinausziehen. Zeichnung an der Tafel gemeinsam ausprobieren.","description":"2 Minuten allein nachdenken, dann in Zweierteams vergleichen.","noMaterial":true},{"id":"v04-17","title":"Drei Türen","type":"Rätsel","kind":"Knobeln","minutes":10,"max":10,"grades":"9–13","content":"Hinter einer von drei Türen liegt der Gewinn. Nach deiner Wahl wird eine andere Niete gezeigt. Solltest du wechseln?","answer":"Ja: Beim klassischen Monty-Hall-Problem mit informiertem Moderator erhöht Wechseln die Gewinnchance von 1/3 auf 2/3.","description":"2 Minuten allein nachdenken, dann in Zweierteams vergleichen.","noMaterial":true},{"id":"v04-18","title":"Überquerung","type":"Rätsel","kind":"Knobeln","minutes":10,"max":10,"grades":"7–13","content":"Zwei Erwachsene und zwei Kinder müssen über einen Fluss. Das Boot trägt entweder einen Erwachsenen oder zwei Kinder. Wie schaffen sie es?","answer":"Kinder gemeinsam hin; eins zurück; Erwachsener hin; anderes Kind zurück; Kinder hin. Für den zweiten Erwachsenen wiederholen.","description":"2 Minuten allein nachdenken, dann in Zweierteams vergleichen.","noMaterial":true},{"id":"v04-19","title":"Wörter sortieren","type":"Rätsel","kind":"Knobeln","minutes":10,"max":10,"grades":"5–8","content":"Sortiert Wasser, Dampf, Eis, Nebel nach fest, flüssig und gasförmig. Was ist am Nebel überraschend?","answer":"Eis fest; Wasser flüssig; Wasserdampf gasförmig und unsichtbar; Nebel besteht aus kleinen flüssigen Tröpfchen.","description":"2 Minuten allein nachdenken, dann in Zweierteams vergleichen.","noMaterial":true},{"id":"v04-20","title":"Flaschenrätsel","type":"Rätsel","kind":"Knobeln","minutes":10,"max":10,"grades":"6–10","content":"Du hast Gefäße mit 3 und 5 Litern. Wie misst du genau 4 Liter ab?","answer":"5-Liter-Gefäß füllen, 3 Liter abgießen: 2 bleiben. 3-Liter-Gefäß leeren, 2 Liter hineingeben, 5-Liter-Gefäß neu füllen und noch 1 Liter in das 3-Liter-Gefäß gießen: 4 bleiben im 5-Liter-Gefäß.","description":"2 Minuten allein nachdenken, dann in Zweierteams vergleichen.","noMaterial":true},{"id":"v04-21","title":"Hausaufgaben abschaffen?","type":"Debatte","kind":"Diskutieren","minutes":15,"max":15,"grades":"5–13","content":"These: Hausaufgaben sollten grundsätzlich abgeschafft werden. 2 Minuten Pro/Contra sammeln, je 1 Minute Eröffnungsstatement, danach freie Debatte.","answer":"Mögliche Aspekte: Übung, Chancengerechtigkeit, Freizeit, Selbstständigkeit, Lernwirksamkeit, familiäre Unterstützung.","description":"Rollen Pro/Contra zufällig vergeben; Positionen am Ende kritisch reflektieren.","noMaterial":true},{"id":"v04-22","title":"Handys in der Schule?","type":"Debatte","kind":"Diskutieren","minutes":15,"max":15,"grades":"7–13","content":"These: Smartphones sollten im Schulalltag vollständig verboten werden. Position beziehen und je zwei starke Argumente formulieren.","answer":"Abwägen: Ablenkung, Medienkompetenz, Datenschutz, Erreichbarkeit, Notfälle, Altersstufe.","description":"Rollen Pro/Contra zufällig vergeben; Positionen am Ende kritisch reflektieren.","noMaterial":true},{"id":"v04-23","title":"ÖPNV kostenlos?","type":"Debatte","kind":"Diskutieren","minutes":15,"max":15,"grades":"7–13","content":"These: Bus und Bahn sollten für alle kostenlos sein. Zwei Gruppen argumentieren gegeneinander.","answer":"Finanzierung, Klimaschutz, soziale Gerechtigkeit, Kapazität, Alternativen.","description":"Rollen Pro/Contra zufällig vergeben; Positionen am Ende kritisch reflektieren.","noMaterial":true},{"id":"v04-24","title":"Noten oder Feedback?","type":"Debatte","kind":"Diskutieren","minutes":15,"max":15,"grades":"7–13","content":"These: Ausführliches Feedback ist sinnvoller als Schulnoten. Zwei Positionen vertreten.","answer":"Vergleichbarkeit, Motivation, Transparenz, Leistungsdruck, Aufwand.","description":"Rollen Pro/Contra zufällig vergeben; Positionen am Ende kritisch reflektieren.","noMaterial":true},{"id":"v04-25","title":"Tierparks und Zoos?","type":"Debatte","kind":"Diskutieren","minutes":15,"max":15,"grades":"7–13","content":"These: Zoos sollten grundsätzlich abgeschafft werden. Trenne Artenschutzargumente von Tierschutzargumenten.","answer":"Artenschutz, Tierwohl, Bildung, Forschung, Haltung, Auswilderung.","description":"Rollen Pro/Contra zufällig vergeben; Positionen am Ende kritisch reflektieren.","noMaterial":true},{"id":"v04-26","title":"Verpackung verbieten?","type":"Debatte","kind":"Diskutieren","minutes":15,"max":15,"grades":"7–13","content":"These: Einwegverpackungen sollten weitgehend verboten werden. Besprecht Ausnahmen.","answer":"Abfall, Hygiene, Transport, Kosten, Wiederverwendung, Kreislaufwirtschaft.","description":"Rollen Pro/Contra zufällig vergeben; Positionen am Ende kritisch reflektieren.","noMaterial":true},{"id":"v04-27","title":"KI in Hausaufgaben?","type":"Debatte","kind":"Diskutieren","minutes":15,"max":15,"grades":"8–13","content":"These: KI-Hilfsmittel sollten für alle Hausaufgaben erlaubt sein. Definiert Bedingungen.","answer":"Chancen beim Lernen, Eigenleistung, Quellenprüfung, Fairness, Datenschutz.","description":"Rollen Pro/Contra zufällig vergeben; Positionen am Ende kritisch reflektieren.","noMaterial":true},{"id":"v04-28","title":"Fleisch in der Mensa?","type":"Debatte","kind":"Diskutieren","minutes":15,"max":15,"grades":"7–13","content":"These: Die Schulmensa sollte ausschließlich vegetarische Gerichte anbieten.","answer":"Umwelt, Gesundheit, Entscheidungsfreiheit, Preis, Akzeptanz, Ernährungsqualität.","description":"Rollen Pro/Contra zufällig vergeben; Positionen am Ende kritisch reflektieren.","noMaterial":true},{"id":"v04-29","title":"30 Sekunden erklären","type":"Aktivität","kind":"Aktivieren","minutes":5,"max":5,"grades":"5–13","content":"Wähle einen Begriff aus dem aktuellen Unterricht. Erkläre ihn in 30 Sekunden, ohne den Begriff selbst zu nennen.","answer":"Variante: Nur drei Sätze erlauben; Klasse errät den Begriff.","description":"Ohne Vorbereitung, mündlich oder an der Tafel.","noMaterial":true},{"id":"v04-30","title":"Falscher Experte","type":"Aktivität","kind":"Aktivieren","minutes":5,"max":5,"grades":"7–13","content":"Eine Person erklärt einen Alltagsgegenstand mit drei echten Fakten und einer erfundenen Behauptung. Die anderen erkennen den Fehler.","answer":"Bei naturwissenschaftlichen Fakten die erfundene Behauptung am Ende auflösen.","description":"Ohne Vorbereitung, mündlich oder an der Tafel.","noMaterial":true},{"id":"v04-31","title":"Drei Begriffe – eine Geschichte","type":"Aktivität","kind":"Aktivieren","minutes":5,"max":5,"grades":"5–10","content":"Wähle spontan drei Begriffe aus dem Fachthema. Formuliere eine kurze Geschichte, in der die Begriffe sinnvoll zusammenhängen.","answer":"Im Anschluss fachliche Richtigkeit gemeinsam prüfen.","description":"Ohne Vorbereitung, mündlich oder an der Tafel.","noMaterial":true},{"id":"v04-32","title":"Tabu in 60 Sekunden","type":"Aktivität","kind":"Aktivieren","minutes":5,"max":5,"grades":"6–13","content":"Erkläre einen Fachbegriff, ohne drei vorher bestimmte Schlüsselwörter zu nutzen. Andere raten.","answer":"Beispiel: Photosynthese ohne Licht, Pflanzen, Zucker.","description":"Ohne Vorbereitung, mündlich oder an der Tafel.","noMaterial":true},{"id":"v04-33","title":"Argument in einem Satz","type":"Aktivität","kind":"Aktivieren","minutes":5,"max":5,"grades":"5–9","content":"Zu einer Behauptung formuliert jeder ein begründetes Argument nach dem Muster: Ich denke …, weil …","answer":"Zwei unterschiedliche Positionen vergleichen.","description":"Ohne Vorbereitung, mündlich oder an der Tafel.","noMaterial":true},{"id":"v04-34","title":"Eine Minute zeichnen","type":"Aktivität","kind":"Aktivieren","minutes":5,"max":5,"grades":"5–9","content":"Eine Person zeichnet einen Begriff aus dem aktuellen Unterricht, die anderen erraten ihn.","answer":"Anschließend fachlich erklären, warum die Zeichnung passt.","description":"Ohne Vorbereitung, mündlich oder an der Tafel.","noMaterial":true},{"id":"v04-35","title":"Kettenwissen","type":"Aktivität","kind":"Aktivieren","minutes":5,"max":5,"grades":"5–13","content":"Person A nennt einen Fachbegriff, Person B nennt einen passenden Zusammenhang, Person C ergänzt ein Beispiel.","answer":"Kette unterbrechen, wenn ein Zusammenhang fachlich nicht stimmt, und gemeinsam korrigieren.","description":"Ohne Vorbereitung, mündlich oder an der Tafel.","noMaterial":true},{"id":"v04-36","title":"Fehler im Satz","type":"Aktivität","kind":"Aktivieren","minutes":5,"max":5,"grades":"5–13","content":"Lehrkraft formuliert absichtlich einen falschen Satz zum aktuellen Thema. Schüler entdecken Fehler und verbessern ihn.","answer":"Beispiel: Wasserdampf ist immer sichtbar. Korrektur: Gasförmiger Wasserdampf ist unsichtbar.","description":"Ohne Vorbereitung, mündlich oder an der Tafel.","noMaterial":true},{"id":"v04-37","title":"Vier-Ecken-Abstimmung","type":"Aktivität","kind":"Bewegung","minutes":5,"max":5,"grades":"5–10","content":"Markiere vier Raumecken als A, B, C, D. Stelle eine Frage mit vier Alternativen. Schüler bewegen sich zur gewählten Ecke.","answer":"Nach dem Austausch dürfen Schüler die Ecke wechseln und ihre Entscheidung begründen.","description":"Im Klassenraum möglich; Bewegung an die Raumsituation anpassen.","noMaterial":true},{"id":"v04-38","title":"Aufstehen bei Zustimmung","type":"Aktivität","kind":"Bewegung","minutes":5,"max":5,"grades":"5–9","content":"Lies nacheinander drei kurze Thesen vor. Wer zustimmt, steht auf. Einzelne begründen ihre Entscheidung.","answer":"Thesen möglichst fachbezogen formulieren und auf unterschiedliche Perspektiven achten.","description":"Im Klassenraum möglich; Bewegung an die Raumsituation anpassen.","noMaterial":true},{"id":"v04-39","title":"Stille Zahlenreihe","type":"Aktivität","kind":"Bewegung","minutes":5,"max":5,"grades":"5–10","content":"Die Klasse zählt gemeinsam bis 20, ohne feste Reihenfolge. Sprechen zwei gleichzeitig, beginnt die Klasse erneut.","answer":"Kurze Übung in Aufmerksamkeit und Selbstkoordination; niemand muss sich bewegen.","description":"Im Klassenraum möglich; Bewegung an die Raumsituation anpassen.","noMaterial":true},{"id":"v04-40","title":"Spiegelbewegungen","type":"Aktivität","kind":"Bewegung","minutes":5,"max":5,"grades":"5–9","content":"Zu zweit stehen. Person A führt langsame Bewegungen aus, B spiegelt. Nach einer Minute wechseln.","answer":"Auf genügend Abstand achten; freiwillige Teilnahme ermöglichen.","description":"Im Klassenraum möglich; Bewegung an die Raumsituation anpassen.","noMaterial":true},{"id":"v04-41","title":"Sortierlinie","type":"Aktivität","kind":"Bewegung","minutes":5,"max":5,"grades":"5–9","content":"Ordnet euch schweigend nach Geburtsmonat oder Schuhgröße im Raum. Danach Ergebnis prüfen.","answer":"Keine sensiblen Kriterien verwenden; Raum und Barrierefreiheit beachten.","description":"Im Klassenraum möglich; Bewegung an die Raumsituation anpassen.","noMaterial":true},{"id":"v04-42","title":"Standbild","type":"Aktivität","kind":"Bewegung","minutes":5,"max":5,"grades":"5–10","content":"Kleine Gruppen stellen ein Unterrichtsthema als lebendes Standbild dar. Andere erraten das Thema.","answer":"Optional einzelne Figuren nach ihrer Rolle befragen.","description":"Im Klassenraum möglich; Bewegung an die Raumsituation anpassen.","noMaterial":true},{"id":"v04-43","title":"Papierbrücke bauen","type":"Aktivität","kind":"Aktivieren","minutes":20,"max":20,"grades":"5–9","content":"Eine Brücke aus einem A4-Blatt zwischen zwei Büchern bauen. Welche Faltung trägt die meisten Münzen?","answer":"Material: A4-Papier, zwei Bücher, einige Münzen. Fachlicher Impuls: Profil und Faltung verändern Steifigkeit.","description":"Kurze Arbeitsphase mit anschließendem Vergleich.","noMaterial":false},{"id":"v04-44","title":"Turmbau mit Papier","type":"Aktivität","kind":"Aktivieren","minutes":20,"max":20,"grades":"5–9","content":"Baut aus drei A4-Blättern den höchsten frei stehenden Turm. Keine zusätzlichen Materialien.","answer":"Nach der Bauzeit Stabilität vergleichen und Verbesserungen besprechen.","description":"Kurze Arbeitsphase mit anschließendem Vergleich.","noMaterial":false},{"id":"v04-45","title":"Diskussionslinie","type":"Aktivität","kind":"Aktivieren","minutes":20,"max":20,"grades":"7–13","content":"Links im Raum bedeutet stimme nicht zu, rechts stimme zu. Stellt euch zu einer kontroversen These auf und begründet.","answer":"Zuerst Positionen hören, dann Möglichkeit zum Wechseln geben.","description":"Kurze Arbeitsphase mit anschließendem Vergleich.","noMaterial":true},{"id":"v04-46","title":"Vertretung: Wissenschaftliche Schätzungen","type":"Aktivität","kind":"Aktivieren","minutes":45,"max":45,"grades":"6–9","content":"5 Min Einstieg: Wie schwer ist die Luft im Klassenzimmer?\n10 Min: 3 Schätzfragen in Partnerarbeit\n15 Min: Maße des Raums abschätzen und Volumen berechnen\n10 Min: Ergebnisse und Annahmen vergleichen\n5 Min: Überraschendstes Ergebnis festhalten","answer":"Hinweise: Luftdichte ca. 1,2 kg/m³; Volumen = Länge × Breite × Höhe. Lösungen hängen von den Raummaßen ab.","description":"Fertiger 45-Minuten-Unterrichtsablauf. Phasen können mit dem Timer begleitet werden.","noMaterial":true},{"id":"v04-47","title":"Vertretung: Streitfrage Schule","type":"Aktivität","kind":"Aktivieren","minutes":45,"max":45,"grades":"7–13","content":"5 Min: These Hausaufgaben abschaffen\n10 Min: Pro/Contra in Gruppen\n10 Min: Eröffnungsstatements\n15 Min: moderierte Debatte\n5 Min: Meinungsänderungen reflektieren","answer":"Auf Redeanteile achten. Argumente von bloßen Behauptungen unterscheiden.","description":"Fertiger 45-Minuten-Unterrichtsablauf. Phasen können mit dem Timer begleitet werden.","noMaterial":true},{"id":"v04-48","title":"Vertretung: Logiklabor","type":"Aktivität","kind":"Aktivieren","minutes":45,"max":45,"grades":"7–10","content":"5 Min: Kurzer Denkanstoß\n10 Min: Zahlenfolgenrätsel\n10 Min: Flaschenrätsel\n15 Min: Drei-Schalter-Rätsel\n5 Min: Strategien vergleichen","answer":"Lösungen: Zahlenfolge 42; Flaschenrätsel durch Umfüllen; Schalter über Licht und Wärme (Glühlampen).","description":"Fertiger 45-Minuten-Unterrichtsablauf. Phasen können mit dem Timer begleitet werden.","noMaterial":true},{"id":"v04-49","title":"Vertretung: Unsere Wahrnehmung","type":"Aktivität","kind":"Aktivieren","minutes":45,"max":45,"grades":"5–9","content":"5 Min: Ein optisches Täuschungsbild zeigen (eigenes Bild nötig)\n10 Min: Beobachtungen sammeln\n15 Min: Unterschied Wahrnehmung/Interpretation mit Alltagsbeispielen\n10 Min: Eigene Täuschung skizzieren\n5 Min: Auswertung","answer":"Material: Ein geeignetes Bild / Beamer und Papier; Wahrnehmung nicht mit Absichtstäuschung verwechseln.","description":"Fertiger 45-Minuten-Unterrichtsablauf. Phasen können mit dem Timer begleitet werden.","noMaterial":false},{"id":"v04-50","title":"Vertretung: Nachhaltigkeit vor Ort","type":"Aktivität","kind":"Aktivieren","minutes":45,"max":45,"grades":"6–10","content":"5 Min: Was bedeutet Nachhaltigkeit?\n10 Min: Beispiele aus Schule und Alltag sammeln\n15 Min: Gruppen entwickeln konkrete Verbesserungsidee\n10 Min: Pitch je Gruppe\n5 Min: Ideen priorisieren","answer":"Leitfragen: Wirkung, Aufwand, Kosten, Zuständigkeit und Umsetzbarkeit.","description":"Fertiger 45-Minuten-Unterrichtsablauf. Phasen können mit dem Timer begleitet werden.","noMaterial":true}];function formatTime(s){s=Math.max(0,Math.ceil(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function updateStatus(){const s=$('#status');s.innerHTML=timer.running?`<span>◷ Timer läuft: <b data-status-time>${formatTime(timer.left)}</b></span><span><button class="tiny" data-open="timer">Öffnen</button><button class="tiny" data-timer="toggle">Pause</button></span>`:`<span>◷ ${timer.left!==timer.preset?`Timer pausiert: ${formatTime(timer.left)}`:'Keine laufenden Vorgänge'}</span><span>${timer.left!==timer.preset?'<button class="tiny" data-open="timer">Öffnen</button>':''}</span>`}
function tick(){if(gameTimerRunning){let v=Math.max(0,Math.ceil((gameTimerEnd-Date.now())/1000));let node=$('#gameClockValue');if(node)node.textContent=Math.floor(v/60)+':'+String(v%60).padStart(2,'0');if(v===0){gameTimerRunning=false;gameSeconds=60;play('gong')}}if(timer.running){let old=timer.left;timer.left=Math.max(0,(timer.end-Date.now())/1000);if(old>0&&timer.left===0){timer.running=false;if(timer.alarm)play('gong');render()}}$$('[data-time]').forEach(e=>e.textContent=formatTime(timer.left));$$('[data-status-time]').forEach(e=>e.textContent=formatTime(timer.left))}setInterval(tick,200);
let audioCtx=null,oscNodes=[];function play(type){try{audioCtx ||=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let now=audioCtx.currentTime;function note(f,d,start=0,w='sine',amp=.16){let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=w;o.frequency.setValueAtTime(f,now+start);g.gain.setValueAtTime(.0001,now+start);g.gain.exponentialRampToValueAtTime(Math.max(.0002,amp*store.soundVolume),now+start+.012);g.gain.exponentialRampToValueAtTime(.0001,now+start+d);o.connect(g).connect(audioCtx.destination);o.start(now+start);o.stop(now+start+d+.03);oscNodes.push(o)}if(type==='gong'){note(523,.9);note(784,1.1,.07)}else if(type==='boop'){note(190,.4,0,'sawtooth');note(125,.28,.17,'square')}else if(type==='fanfare'||type==='cheer'){[392,523,659,784].forEach((n,i)=>note(n,.23,i*.15,'triangle'))}else if(type==='error'){note(180,.26,0,'square');note(135,.26,.27,'square')}else if(type==='drum'||type==='applause'||type==='laugh'){let count=type==='applause'?14:type==='laugh'?6:10;for(let i=0;i<count;i++)note(120+Math.random()*700,.07,i*.06,'triangle',.1)} }catch(e){console.warn('Audio nicht verfügbar',e)}}

function gradeFits(text,g){if(!text||!g)return true;let nums=String(text).match(/\d+/g)?.map(Number)||[];if(!nums.length)return true;return nums.length===1?nums[0]===g:nums[0]<=g&&g<=nums[1]}
function spontanMatches(){let g=Number((prof().name.match(/(?:Klasse\s*)?(\d{1,2})\s*[a-z]?$/i)||[])[1])||0;let all=[...START_IDEAS,...store.library.filter(x=>['Schätzfrage','Rätsel','Debatte','Aktivität','Quizfrage','Arbeitsauftrag'].includes(x.type)&&contextMatch(x)).map(x=>({...x,libraryId:x.id,kind:({Schätzfrage:'Knobeln',Rätsel:'Knobeln',Debatte:'Diskutieren',Aktivität:'Aktivieren',Quizfrage:'Knobeln',Arbeitsauftrag:'Aktivieren'})[x.type],noMaterial:!/papier|stift|material|schere|kleber|bücher/i.test(x.description||'')}))];return all.filter(x=>{let t=Number(x.minutes)||Number(x.max)||10;return t<=spontanTime&&(!g||gradeFits(x.grades,g))&&(spontanGoal==='Alle'||x.kind===spontanGoal)&&(!spontanNoMaterial||x.noMaterial)})}
function wheelInput(){let el=$('#wheelItems');if(el)wheelChoices=el.value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,150)}
function drawWheel(){let c=$('#wheelCanvas');if(!c)return;let ctx=c.getContext('2d'),a=wheelChoices,n=a.length;ctx.clearRect(0,0,420,420);if(!n){ctx.fillStyle='#fff';ctx.font='22px system-ui';ctx.textAlign='center';ctx.fillText('Liste ist leer',210,210);return}let colors=['#386e6d','#546f94','#836286','#916b4d','#357a78','#7a648e','#586f84','#977a52'];for(let i=0;i<n;i++){let start=-Math.PI/2+i*2*Math.PI/n;ctx.beginPath();ctx.moveTo(210,210);ctx.arc(210,210,191,start,start+2*Math.PI/n);ctx.closePath();ctx.fillStyle=wheelUsed.has(i)?'#404651':colors[i%colors.length];ctx.fill();ctx.strokeStyle='#202a36';ctx.lineWidth=n>50?1:2;ctx.stroke();if(n<=45){let angle=start+Math.PI/n;ctx.save();ctx.translate(210,210);ctx.rotate(angle);ctx.fillStyle=wheelUsed.has(i)?'#bdc2c9':'#ffffff';ctx.textAlign='right';ctx.textBaseline='middle';const font=n<=12?15:n<=25?12:10.5;ctx.font=`600 ${font}px system-ui`;let label=String(a[i]);let max=n<=15?23:n<=30?18:15;if(label.length>max)label=label.slice(0,max-1)+'…';ctx.fillText(label,175,0,138);ctx.restore()}}ctx.beginPath();ctx.arc(210,210,22,0,7);ctx.fillStyle='#1b2632';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();c.style.transition='none';c.style.transform=`rotate(${wheelAngle}deg)`}
function spinWheel(){
 if(wheelSpinning)return;
 wheelInput();
 let available=wheelChoices.map((_,i)=>i).filter(i=>!wheelNoRepeat||!wheelUsed.has(i));
 if(!available.length){alert('Alle Einträge wurden bereits gezogen. Bitte zurücksetzen.');return}
 const canvas=$('#wheelCanvas');if(!canvas)return;
 const idx=available[Math.floor(Math.random()*available.length)];
 const n=wheelChoices.length,step=360/n;
 const startAngle=wheelAngle;
 const normalized=((startAngle%360)+360)%360;
 // Segment centers start at 12 o'clock and the pointer is fixed at the top.
 const target=((360-(idx+.5)*step)%360+360)%360;
 const extra=(target-normalized+360)%360;
 const finalAngle=startAngle+5*360+extra;
 const duration=3400;
 wheelSpinning=true;
 const label=$('#wheelOutcome');if(label)label.textContent='Dreht …';
 const spinButton=$('[data-wheel-spin]');if(spinButton)spinButton.disabled=true;
 const startTime=performance.now();
 function frame(now){
  if(!canvas.isConnected){wheelSpinning=false;wheelAngle=finalAngle;wheelResult=wheelChoices[idx];if(wheelNoRepeat)wheelUsed.add(idx);render();return}
  const progress=Math.min(1,(now-startTime)/duration);
  const ease=1-Math.pow(1-progress,4);
  const angle=startAngle+(finalAngle-startAngle)*ease;
  canvas.style.transition='none';canvas.style.transform=`rotate(${angle}deg)`;
  if(progress<1){requestAnimationFrame(frame);return}
  wheelAngle=finalAngle;wheelResult=wheelChoices[idx];
  if(wheelNoRepeat)wheelUsed.add(idx);
  wheelSpinning=false;
  render();
 }
 requestAnimationFrame(frame);
}

function qrSvgMarkup(v){let qr=null,bytes=unescape(encodeURIComponent(v));for(let t=1;t<=32;t++){try{let q=new QRCode(t,0);q.addData(bytes);q.make();qr=q;break}catch(e){}}if(!qr)throw Error('Text ist für QR-Code zu lang');let n=qr.getModuleCount(),path='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))path+=`M${x+4} ${y+4}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+8} ${n+8}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${path}" fill="#000"/></svg>`}
function renderQR(){let target=$('#qrPreview');if(!target)return;if(!qrInput){target.innerHTML='<small>Gib einen Link oder Text ein.</small>';return}try{target.innerHTML=`<div class="qrSvg" style="margin:auto">${qrSvgMarkup(qrInput)}</div>`}catch(e){target.textContent='QR-Code nicht möglich: '+e.message}}
function qrDownload(){if(!qrInput)return;try{let svg=qrSvgMarkup(qrInput),a=document.createElement('a'),u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.href=u;a.download='lehrer-cockpit-qr.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){alert(e.message)}}

const PATCH_FIELDS=new Set(['title','type','url','subject','grades','topic','minutes','tags','description','content','answer','favorite']);
async function updateMaterialPack(){const file=$('#updateFile')?.files?.[0];if(!file)return alert('Bitte eine JSON-Aktualisierungsdatei auswählen.');try{
const obj=JSON.parse(await file.text());if(!obj||obj.schema!==1||obj.kind!=='material-updates'||!Array.isArray(obj.operations)||obj.operations.length===0||obj.operations.length>500)throw Error('Erwartet: schema 1, kind material-updates, operations (1–500).');
const seen=new Set(), changes=[];for(const op of obj.operations){if(!op||!['update','delete'].includes(op.action)||typeof op.id!=='string'||!op.id.trim())throw Error('Ungültige Aktion oder Kennung.');if(seen.has(op.id))throw Error('Doppelte Kennung: '+op.id);seen.add(op.id);const old=store.library.find(x=>x.id===op.id);if(!old)throw Error('Material nicht gefunden: '+op.id);if(op.action==='delete'){changes.push({action:'delete',id:op.id,title:old.title});continue}
const patch=op.changes;if(!patch||typeof patch!=='object'||Array.isArray(patch)||!Object.keys(patch).length)throw Error('Änderungen fehlen: '+op.id);for(const [key,val] of Object.entries(patch)){if(!PATCH_FIELDS.has(key))throw Error('Nicht erlaubtes Feld: '+key);if(key==='favorite'){if(typeof val!=='boolean')throw Error('favorite muss true/false sein.')}else if(key==='minutes'){if(typeof val!=='number'||!Number.isFinite(val)||val<0||val>999)throw Error('Ungültige Dauer.')}else if(typeof val!=='string')throw Error('Erwarteter Text bei: '+key)}
const revised={...old,...patch};if(!String(revised.title||'').trim()||String(revised.title).length>160||!LIB_TYPES.includes(revised.type))throw Error('Ungültiger Titel oder Materialtyp: '+op.id);if(revised.url&&!((revised.type==='Bilderrätsel'&&validImageSource(revised.url))||/^https?:\/\//i.test(revised.url)))throw Error('Ungültige URL: '+op.id);changes.push({action:'update',id:op.id,title:old.title,patch});}
const preview=changes.map(c=>(c.action==='delete'?'LÖSCHEN':'ÄNDERN')+': '+c.title+' ['+c.id+']'+(c.patch?' – '+Object.keys(c.patch).join(', '):'')).join('\n');if(!confirm('VORSCHAU – '+changes.length+' Materialänderungen:\n\n'+preview.slice(0,9000)+'\n\nVorhandene Materialien ändern/löschen? Vorher eine vollständige Datensicherung herunterladen.'))return;
let newLibrary=store.library.map(x=>({...x}));for(const c of changes){const i=newLibrary.findIndex(x=>x.id===c.id);if(c.action==='delete')newLibrary.splice(i,1);else newLibrary[i]={...newLibrary[i],...c.patch}}store.library=newLibrary;persist();closeModal();showTool('library');alert(changes.filter(x=>x.action==='update').length+' geändert, '+changes.filter(x=>x.action==='delete').length+' gelöscht.');
}catch(e){alert('Materialaktualisierung abgebrochen. Keine Änderungen vorgenommen.\n'+e.message)}}
